<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cairn">
  <!-- 四层石堆，对应 App 图标：底下三块深蓝渐变，顶上一块绿松石。
       每块略微歪一点点（rotate ±2°），垒起来才像石头而不像柱状图。 -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6491"/>
      <stop offset="1" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fbe7f"/>
      <stop offset="1" stop-color="#1eb3a6"/>
    </linearGradient>
  </defs>
  <rect x="13" y="42" width="38" height="11" rx="5.5" fill="#16294a"/>
  <rect x="18" y="30" width="29" height="10" rx="5" fill="url(#stone)" transform="rotate(-1.5 32.5 35)"/>
  <rect x="19" y="19" width="23" height="9.5" rx="4.75" fill="#3d5f8c" transform="rotate(2 30.5 23.75)"/>
  <rect x="22" y="8" width="17" height="9.5" rx="4.75" fill="url(#cap)" transform="rotate(-3 30.5 12.75)"/>
</svg>
